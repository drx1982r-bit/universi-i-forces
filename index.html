<!DOCTYPE html>
<html lang="sq" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universi i Forcave – Eksploro fizikën në mënyrë interaktive</title>
<meta name="description" content="Platformë edukative interaktive në shqip për të gjitha llojet e forcave: simulime, laborator virtual, lojëra, kuize, kalkulator dhe më shumë.">
<meta name="author" content="Dean Ramolli, Eneo Kaziu, Erald Hida">
<meta name="theme-color" content="#05060f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060f; --bg2:#0a0d24; --panel:rgba(20,24,60,.55); --panel2:rgba(30,36,90,.45);
  --line:rgba(140,160,255,.18); --text:#e9ecff; --muted:#9aa3d6; --dim:#6a73a8;
  --blue:#3d8bff; --cyan:#3ddcff; --violet:#8b5cff; --pink:#ff4fd8; --green:#2ee59d; --red:#ff4d6d; --yellow:#ffd23d; --orange:#ff8a3d;
  --grad:linear-gradient(135deg,#3ddcff 0%,#7c5cff 50%,#ff4fd8 100%);
  --glow:0 0 24px rgba(61,139,255,.45);
  --radius:20px; --shadow:0 20px 60px rgba(0,0,0,.45);
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; --head:'Space Grotesk','Inter',system-ui,sans-serif;
  --canvasbg:#070a1c;
}
[data-theme=light]{
  --bg:#eef1ff; --bg2:#dfe5ff; --panel:rgba(255,255,255,.7); --panel2:rgba(255,255,255,.85);
  --line:rgba(60,70,160,.16); --text:#121633; --muted:#4b5487; --dim:#7a83b5; --shadow:0 18px 50px rgba(40,50,120,.15);
  --canvasbg:#f7f8ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;min-height:100vh;transition:background .4s,color .4s}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
  radial-gradient(900px 600px at 10% -10%,rgba(124,92,255,.25),transparent 60%),
  radial-gradient(800px 600px at 110% 10%,rgba(61,220,255,.18),transparent 60%),
  radial-gradient(900px 700px at 50% 120%,rgba(255,79,216,.14),transparent 60%),var(--bg)}
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none}
a{color:var(--cyan);text-decoration:none}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--head);line-height:1.15;letter-spacing:-.01em}
::selection{background:var(--violet);color:#fff}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Loader ---------- */
#loader{position:fixed;inset:0;z-index:999;background:#04050d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s,visibility .7s}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.atom{position:relative;width:120px;height:120px}
.atom .nuc{position:absolute;inset:48px;border-radius:50%;background:var(--grad);box-shadow:0 0 30px #7c5cff}
.atom .orb{position:absolute;inset:0;border:2px solid rgba(61,220,255,.6);border-radius:50%;animation:spin 1.6s linear infinite}
.atom .orb:nth-child(2){transform:rotate(60deg) scaleY(.4);animation:spin2 1.2s linear infinite}
.atom .orb:nth-child(3){transform:rotate(-60deg) scaleY(.4);animation:spin3 1.4s linear infinite;border-color:rgba(255,79,216,.6)}
.atom .orb:nth-child(4){transform:scaleY(.4);animation:spin4 1s linear infinite;border-color:rgba(124,92,255,.7)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin2{from{transform:rotate(60deg) scaleY(.4)}to{transform:rotate(420deg) scaleY(.4)}}
@keyframes spin3{from{transform:rotate(-60deg) scaleY(.4)}to{transform:rotate(300deg) scaleY(.4)}}
@keyframes spin4{from{transform:rotate(0) scaleY(.4)}to{transform:rotate(360deg) scaleY(.4)}}
.loadbar{width:220px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:var(--grad);animation:load 1.3s ease forwards}
@keyframes load{to{width:100%}}
#loader p{color:#9aa3d6;font-family:var(--head);letter-spacing:.25em;font-size:.8rem}

/* ---------- Nav ---------- */
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--grad);z-index:200;box-shadow:var(--glow)}
nav.top{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:14px;padding:12px 22px;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);background:rgba(6,8,22,.62);border-bottom:1px solid var(--line)}
[data-theme=light] nav.top{background:rgba(255,255,255,.72)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:700;color:var(--text);white-space:nowrap}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:var(--glow);font-size:18px}
.navlinks{display:flex;gap:2px;margin-left:auto;flex-wrap:nowrap}
.navlinks a{color:var(--muted);padding:8px 11px;border-radius:10px;font-size:.88rem;font-weight:500;transition:.2s;white-space:nowrap}
.navlinks a:hover{color:var(--text);background:var(--panel2)}
.navlinks a.active{color:#fff;background:linear-gradient(135deg,rgba(61,139,255,.35),rgba(139,92,255,.35));box-shadow:inset 0 0 0 1px rgba(140,160,255,.3)}
[data-theme=light] .navlinks a.active{color:var(--text)}
.navtools{display:flex;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;font-size:17px;transition:.2s}
.iconbtn:hover{border-color:var(--cyan);box-shadow:var(--glow);transform:translateY(-1px)}
#burger{display:none}
.mobilemenu{position:fixed;inset:62px 0 0 0;z-index:99;background:rgba(5,6,15,.96);backdrop-filter:blur(14px);padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;transform:translateY(-110%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
[data-theme=light] .mobilemenu{background:rgba(238,241,255,.97)}
.mobilemenu.open{transform:none}
.mobilemenu a{padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-weight:600}
@media (max-width:1180px){.navlinks{display:none}#burger{display:grid}.navtools{margin-left:auto}}

/* ---------- Layout ---------- */
#app{padding-top:64px;min-height:100vh}
.page{animation:pagein .55s cubic-bezier(.2,.8,.2,1)}
@keyframes pagein{from{opacity:0;transform:translateY(18px) scale(.995);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
section.block{padding:70px 0}
.sec-head{text-align:center;max-width:780px;margin:0 auto 42px}
.sec-head .kicker{display:inline-block;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);padding:6px 14px;border:1px solid rgba(61,220,255,.35);border-radius:99px;margin-bottom:16px;background:rgba(61,220,255,.06)}
.sec-head h2{font-size:clamp(2rem,4.5vw,3.2rem);margin-bottom:12px}
.sec-head p{color:var(--muted);font-size:1.08rem}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.card{padding:24px;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s}
.card.hov:hover{transform:translateY(-6px);border-color:rgba(61,220,255,.5);box-shadow:0 24px 60px rgba(61,139,255,.22)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:980px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}section.block{padding:48px 0}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;font-size:.95rem;transition:.25s}
.btn:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:var(--glow)}
.btn.primary{background:var(--grad);border:none;color:#fff;box-shadow:0 10px 30px rgba(124,92,255,.45)}
.btn.primary:hover{box-shadow:0 14px 40px rgba(124,92,255,.65)}
.btn.sm{padding:8px 14px;font-size:.85rem;border-radius:11px}
.btn.on{background:linear-gradient(135deg,rgba(61,139,255,.4),rgba(139,92,255,.4));border-color:rgba(140,160,255,.5)}
.btn:disabled{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:4px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:.75rem;padding:3px 10px;border-radius:99px;font-weight:600}
.tag.k{background:rgba(255,138,61,.15);color:#ffb27d}.tag.d{background:rgba(124,92,255,.18);color:#b9a6ff}.tag.c{background:rgba(61,220,255,.14);color:#8ae9ff}
[data-theme=light] .tag.k{color:#b44f00}[data-theme=light] .tag.d{color:#5a33d6}[data-theme=light] .tag.c{color:#00799a}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:calc(100vh - 64px);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px;padding:40px 0 80px}
@media (max-width:980px){.hero{grid-template-columns:1fr;text-align:center;padding-top:30px}}
.hero h1{font-size:clamp(2.8rem,7.6vw,6.2rem);font-weight:800;line-height:.95;letter-spacing:-.03em}
.title3d{display:block;color:#fff;text-shadow:0 1px 0 #b9c3ff,0 2px 0 #9aa6ff,0 3px 0 #7d89f0,0 4px 0 #6670dc,0 5px 0 #5158c4,0 6px 0 #3f44a8,0 7px 0 #2f338a,0 18px 30px rgba(0,0,0,.6),0 0 60px rgba(124,92,255,.5);animation:float3d 6s ease-in-out infinite;transform-style:preserve-3d}
[data-theme=light] .title3d{color:#2b2f7a;text-shadow:0 1px 0 #6c74e8,0 2px 0 #5c63d6,0 3px 0 #4c52c0,0 4px 0 #3c41a4,0 12px 20px rgba(40,40,120,.3)}
.title3d.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 0 #2f338a) drop-shadow(0 0 30px rgba(255,79,216,.45))}
@keyframes float3d{0%,100%{transform:perspective(800px) rotateX(8deg) rotateY(-6deg) translateY(0)}50%{transform:perspective(800px) rotateX(-4deg) rotateY(6deg) translateY(-8px)}}
.hero .sub{font-size:1.25rem;color:var(--muted);margin:26px 0 30px;max-width:600px}
@media (max-width:980px){.hero .sub{margin-inline:auto}}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap}
@media (max-width:980px){.hero-cta{justify-content:center}}
.planetbox{position:relative;aspect-ratio:1;max-width:560px;width:100%;margin:auto}
#planet{width:100%;height:100%}
.floaty{position:absolute;padding:10px 14px;border-radius:14px;font-size:.85rem;font-weight:600;display:flex;gap:8px;align-items:center;animation:bob 5s ease-in-out infinite;white-space:nowrap}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:16px;text-align:center}
.stat b{display:block;font-family:var(--head);font-size:2rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.8rem;color:var(--muted)}
.scrollhint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:.75rem;letter-spacing:.2em}
.mouse{width:24px;height:38px;border:2px solid var(--muted);border-radius:14px;position:relative}
.mouse::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--cyan);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(12px)}}

/* ---------- Force cards ---------- */
.fcard{position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-height:210px}
.fcard::before{content:"";position:absolute;inset:-1px;background:radial-gradient(400px 200px at var(--mx,50%) var(--my,0%),var(--c,#7c5cff),transparent 60%);opacity:.0;transition:opacity .3s;pointer-events:none}
.fcard:hover::before{opacity:.22}
.fcard .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--c) 40%,transparent)}
.fcard h3{font-size:1.18rem}
.fcard p{color:var(--muted);font-size:.9rem;flex:1}
.fcard .formula-mini{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.85rem;color:var(--c)}
.fav{position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;filter:grayscale(1);opacity:.5;transition:.2s;z-index:2}
.fav.on{filter:none;opacity:1;transform:scale(1.15)}
.visited-dot{position:absolute;top:18px;right:48px;font-size:.7rem;color:var(--green)}

/* ---------- Force detail ---------- */
.fhero{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding:40px 0}
@media (max-width:900px){.fhero{grid-template-columns:1fr}}
.fhero h1{font-size:clamp(2.2rem,5vw,3.6rem)}
.bigformula{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:clamp(1.4rem,3vw,2.1rem);padding:22px;text-align:center;border-radius:18px;background:linear-gradient(135deg,rgba(61,139,255,.12),rgba(139,92,255,.12));border:1px solid var(--line);color:var(--text);text-shadow:0 0 20px rgba(124,92,255,.5)}
.symtable{width:100%;border-collapse:collapse;margin-top:14px}
.symtable td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:.95rem}
.symtable td:first-child{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-weight:700;white-space:nowrap;width:1%}
.list{list-style:none;display:grid;gap:10px}
.list li{padding:12px 14px 12px 40px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);position:relative;font-size:.95rem}
.list li::before{content:"➜";position:absolute;left:14px;color:var(--cyan)}
.list.fact li::before{content:"💡"}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.canvasbox{position:relative;border-radius:18px;overflow:hidden;background:var(--canvasbg);border:1px solid var(--line)}
.canvasbox canvas{display:block;width:100%;height:auto;touch-action:none}

/* ---------- Lab ---------- */
.labnav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
.lab{display:grid;grid-template-columns:1.6fr 1fr;gap:20px}
@media (max-width:980px){.lab{grid-template-columns:1fr}}
.controls{display:flex;flex-direction:column;gap:14px}
.ctrl label{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);margin-bottom:6px}
.ctrl label b{color:var(--text);font-family:'JetBrains Mono',monospace}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--violet));outline:none;opacity:.9}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(124,92,255,.5),0 0 18px rgba(61,220,255,.7);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:none;box-shadow:0 0 0 4px rgba(124,92,255,.5)}
select,input[type=number],input[type=text],input[type=search]{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-family:inherit;font-size:.95rem}
select option{background:var(--bg2);color:var(--text)}
.readout{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.readout div{padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.readout span{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.readout b{font-family:'JetBrains Mono',monospace;font-size:1.05rem}
.calcsteps{font-family:'JetBrains Mono',monospace;font-size:.85rem;background:rgba(0,0,0,.25);padding:12px;border-radius:12px;border:1px solid var(--line);white-space:pre-wrap;line-height:1.7}
[data-theme=light] .calcsteps{background:rgba(255,255,255,.6)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Quiz ---------- */
.qbox{max-width:820px;margin:0 auto;padding:30px}
.qopts{display:grid;gap:12px;margin-top:20px}
.qopt{text-align:left;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:1rem;transition:.2s;display:flex;gap:12px;align-items:center}
.qopt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(4px)}
.qopt .l{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;background:rgba(124,92,255,.2);font-weight:700;font-size:.85rem}
.qopt.ok{border-color:var(--green);background:rgba(46,229,157,.15);animation:pop .4s}
.qopt.bad{border-color:var(--red);background:rgba(255,77,109,.15);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.qbar{height:8px;border-radius:8px;background:var(--panel2);overflow:hidden;margin:12px 0}
.qbar i{display:block;height:100%;background:var(--grad);transition:width .4s}
.explain{margin-top:16px;padding:14px 16px;border-radius:14px;border-left:4px solid var(--cyan);background:var(--panel2);animation:pagein .4s}
.timer{font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:700}
.timer.low{color:var(--red);animation:pulse .6s infinite}
@keyframes pulse{50%{opacity:.4}}
.result-ring{width:170px;height:170px;margin:0 auto}
.breakdown{display:grid;gap:8px;margin-top:16px}
.breakdown .row{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:.88rem}
.breakdown .bar{height:10px;border-radius:10px;background:var(--panel2);overflow:hidden}
.breakdown .bar i{display:block;height:100%;background:var(--grad)}

/* ---------- Games ---------- */
.gamegrid .gcard{cursor:pointer;text-align:center}
.gcard .gi{font-size:44px;margin-bottom:8px;display:inline-block;transition:transform .4s}
.gcard:hover .gi{transform:scale(1.2) rotate(-8deg)}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}
.scene{font-size:72px;text-align:center;padding:30px;border-radius:18px;background:var(--panel2);letter-spacing:10px;animation:scenebob 2.4s ease-in-out infinite}
@keyframes scenebob{50%{transform:translateY(-8px) scale(1.04)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(140%);z-index:300;padding:14px 22px;border-radius:16px;font-weight:600;transition:transform .45s cubic-bezier(.2,.8,.2,1);display:flex;gap:10px;align-items:center;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.ach{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);opacity:.45;filter:grayscale(1)}
.ach.got{opacity:1;filter:none;border-color:rgba(255,210,61,.5);box-shadow:0 0 20px rgba(255,210,61,.15)}
.ach .ai{font-size:28px}
.lb{width:100%;border-collapse:collapse}
.lb td,.lb th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
.lb th{color:var(--muted);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match .mi{padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);text-align:center;font-size:.92rem;transition:.2s;min-height:52px}
.match .mi.sel{border-color:var(--cyan);box-shadow:var(--glow)}
.match .mi.done{border-color:var(--green);background:rgba(46,229,157,.14);opacity:.65;pointer-events:none}
.match .mi.wrong{animation:shake .4s;border-color:var(--red)}
.match .mi.f{font-family:'JetBrains Mono',monospace}
.arrowtray{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.arrowchip{padding:9px 14px;border-radius:12px;border:1px dashed var(--line);background:var(--panel2);color:var(--text);font-size:.85rem;cursor:grab;user-select:none;touch-action:none}
.arrowchip.used{opacity:.3;pointer-events:none}

/* ---------- Compare ---------- */
.cmp-pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.cmp-pick button{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:.88rem;transition:.2s}
.cmp-pick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 35%,transparent)}
.tablewrap{overflow-x:auto;border-radius:18px}
table.cmp{width:100%;border-collapse:collapse;min-width:640px}
table.cmp th,table.cmp td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem;text-align:left}
table.cmp th{font-family:var(--head);font-size:1rem}
table.cmp td:first-child{color:var(--muted);font-weight:600;width:160px}
.presets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}

/* ---------- Misc ---------- */
.searchov{position:fixed;inset:0;z-index:400;background:rgba(3,4,12,.7);backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
.searchov.open{display:flex;animation:pagein .3s}
.searchbox{width:min(680px,92vw);padding:18px}
.searchbox input{font-size:1.1rem;padding:15px 16px}
.sres{max-height:52vh;overflow:auto;margin-top:10px;display:grid;gap:6px}
.sres a{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;color:var(--text);border:1px solid transparent}
.sres a:hover,.sres a.hl{background:var(--panel2);border-color:var(--line)}
.sres small{color:var(--muted);display:block}
details.faq{padding:18px 22px;margin-bottom:12px}
details.faq summary{cursor:pointer;font-weight:600;font-size:1.02rem;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-size:1.4rem;color:var(--cyan);transition:.3s}
details.faq[open] summary::after{transform:rotate(45deg)}
details.faq p{margin-top:10px;color:var(--muted)}
.gloss-letter{font-family:var(--head);font-size:1.6rem;color:var(--cyan)}
.factbox{min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;padding:26px}
.factbox span{animation:pagein .5s}
footer{margin-top:60px;border-top:1px solid var(--line);padding:50px 0 40px;text-align:center;position:relative;overflow:hidden}
.credits{display:inline-block;padding:30px 40px;position:relative}
.credits h4{letter-spacing:.35em;font-size:.95rem;color:var(--cyan);margin-bottom:14px}
.credits .names{font-family:var(--head);font-size:clamp(1.05rem,2.6vw,1.6rem);font-weight:700}
.credits .names span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.credits .names i{color:var(--dim);font-style:normal;margin:0 10px}
.credits::before{content:"";position:absolute;inset:-2px;border-radius:22px;padding:2px;background:conic-gradient(from var(--ang,0deg),#3ddcff,#7c5cff,#ff4fd8,#3ddcff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 6s linear infinite}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes rot{to{--ang:360deg}}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
.concept{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
@media (max-width:820px){.concept{grid-template-columns:1fr}}
.kbd{font-family:'JetBrains Mono',monospace;font-size:.75rem;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.notice{padding:12px 16px;border-radius:12px;background:rgba(61,220,255,.08);border:1px solid rgba(61,220,255,.25);font-size:.9rem}
.err{color:var(--red);font-size:.88rem;min-height:1.2em}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:560px){nav.top{padding:10px 12px;gap:8px}.brand>span:last-child{font-size:.92rem}#bprog{display:none}.iconbtn{width:34px;height:34px;font-size:15px}.navtools{gap:5px}.mobilemenu{inset:56px 0 0 0}.qbox{padding:18px}.card{padding:18px}.floaty{font-size:.72rem;padding:7px 10px}}
@media (max-width:400px){.brand>span:last-child{display:none}}
html,body{max-width:100%;overflow-x:hidden}
@media (min-width:1181px){.mobilemenu{display:none}}

  avioni(ctx, W, H, t) { const x = W / 2 + Math.sin(t) * 20, y = H / 2 + Math.sin(t * 1.3) * 8; for (let i = 0; i < 4; i++) emoji(ctx, '☁️', ((i * 160 - t * 60) % (W + 100) + W + 100) % (W + 100) - 50, 30 + i * 50, 30); emoji(ctx, '✈️', x, y, 64, false, Math.PI / 4); arrow(ctx, x, y - 20, x, y - 80, CLR.A, 'Ngritja', 3); arrow(ctx, x, y + 20, x, y + 80, CLR.W, 'P', 3); arrow(ctx, x + 40, y, x + 110, y, CLR.F, 'Shtytja', 3); arrow(ctx, x - 40, y, x - 110, y, CLR.Ff, 'Rezistenca', 3); }
};

   ========================================================= */
function labLayout(el, title, desc) {
  const L = h(`<div class="lab"><div class="lab-main"></div><div class="glass card controls"><h3>${title}</h3><p class="muted" style="font-size:.9rem">${desc}</p></div></div>`);
  el.appendChild(L); return { main: $('.lab-main', L), ctrl: $('.controls', L) };
}
function btnRow(parent, btns) { const r = h('<div class="btnrow"></div>'); btns.forEach(([t, fn, cls]) => { const b = h(`<button class="btn sm ${cls || ''}">${t}</button>`); b.onclick = () => { Sfx.play('click'); fn(b); }; r.appendChild(b); }); parent.appendChild(r); return r; }
function selectEl(parent, label, opts, val, onChange) { const el = h(`<div class="ctrl"><label><span>${label}</span></label><select aria-label="${esc(label)}">${opts.map(([v, t]) => `<option value="${v}" ${v == val ? 'selected' : ''}>${t}</option>`).join('')}</select></div>`); $('select', el).onchange = e => onChange(e.target.value); parent.appendChild(el); return $('select', el); }
function note(parent, html) { const n = h(`<div class="notice">${html}</div>`); parent.appendChild(n); return n; }

/* Gjurmuesi i vijave të fushës (për elektrike dhe magnetike) */
function traceField(ctx, src, W, H, color, per = 14, alpha = .55) {
  ctx.save(); ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = 1.2;
  const anyPos = src.some(s => s.q > 0);
  src.forEach(s => {
    if (anyPos ? s.q <= 0 : s.q >= 0) return; const dir = anyPos ? 1 : -1; const n = Math.round(per * Math.min(2, Math.abs(s.q) / 2 + .5));
    for (let k = 0; k < n; k++) {
      let x = s.x + Math.cos(k / n * 6.283 + .2) * 10, y = s.y + Math.sin(k / n * 6.283 + .2) * 10; ctx.beginPath(); ctx.moveTo(x, y);
      for (let i = 0; i < 400; i++) {
        let ex = 0, ey = 0; for (const o of src) { const dx = x - o.x, dy = y - o.y, r2 = dx * dx + dy * dy + 1, r = Math.sqrt(r2); ex += o.q * dx / (r2 * r); ey += o.q * dy / (r2 * r); }
        const m = Math.hypot(ex, ey); if (!m) break; x += dir * ex / m * 4; y += dir * ey / m * 4; ctx.lineTo(x, y);
        if (x < -10 || x > W + 10 || y < -10 || y > H + 10) break; if (src.some(o => o !== s && Math.sign(o.q) !== Math.sign(s.q) && Math.hypot(x - o.x, y - o.y) < 8)) break;
      }
      ctx.stroke();
    }
  }); ctx.restore();
}

  const { main, ctrl } = labLayout(el, '🪐 Simulatori i gravitetit', 'Lësho një top nga lartësi të ndryshme dhe krahaso rënien në Tokë, Hënë dhe Mars. Formulat: h = ½gt², v = g·t.');
  const W = 760, H = 440; const c = mkCanvas(main, W, H); const ch = mkCanvas(main, W, 200); ch.parentElement.style.marginTop = '12px';

  const worlds = () => S.cmp ? [['Toka', 9.8, '#3d8bff'], ['Hëna', 1.62, '#c9c9d9'], ['Marsi', 3.71, '#ff6b3d']] : [[PLANETS.find(p => p[1] === S.g)?.[0] || 'I personalizuar', S.g, '#7c5cff']];
  const ro = readout(ctrl, [['t', 'Koha t'], ['v', 'Shpejtësia v'], ['a', 'Nxitimi a'], ['d', 'Distanca e rënë'], ['T', 'Koha e rënies T'], ['vf', 'Shpejtësia në fund']]);

  const gsel = selectEl(ctrl, 'Vendi (g)', [[9.8, '🌍 Toka — 9,8 m/s²'], [1.62, '🌙 Hëna — 1,62 m/s²'], [3.71, '🔴 Marsi — 3,71 m/s²'], [24.79, '🪐 Jupiteri — 24,79 m/s²'], ['c', '⚙️ I personalizuar']], 9.8, v => { if (v === 'c') { gs.classList.remove('hidden'); S.g = +gs.inp.value; } else { gs.classList.add('hidden'); S.g = +v; } reset(); });
  const gs = slider(ctrl, 'g e personalizuar', .5, 30, .1, 9.8, 'm/s²', v => { S.g = v; reset(); }); gs.classList.add('hidden');
  slider(ctrl, 'Shpejtësia horizontale v₀ (trajektore)', 0, 15, .5, 0, 'm/s', v => { S.v0 = v; reset(); });

  note(ctrl, '💡 Në vakum, të gjithë trupat bien me të njëjtin nxitim, pavarësisht nga masa. Koha e rënies T = √(2h/g).');
  function reset() { S.t = 0; S.run = false; S.done = false; S.trail = []; }
  Loops.add(dt => {
    if (S.run) { S.t += dt * (S.slow ? .25 : 1); }
    const ws = worlds(); const Tmax = Math.max(...ws.map(w => Math.sqrt(2 * S.h / w[1])));
    if (S.t >= Tmax && S.run) { S.t = Tmax; S.run = false; S.done = true; Sfx.play('tick'); }
    const ctx = c.ctx, p = pal(); clear(ctx, W, H); const top = 64, bot = H - 40, sc = (bot - top) / S.h;
    ctx.fillStyle = p.ground; ctx.fillRect(0, bot, W, 40);
    for (let m = 0; m <= S.h; m += Math.max(1, Math.round(S.h / 10))) { const y = bot - m * sc; txt(ctx, m + ' m', 8, y, p.muted, 10); ctx.strokeStyle = p.grid; ctx.beginPath(); ctx.moveTo(40, y); ctx.lineTo(W, y); ctx.stroke(); }
    const colW = (W - 60) / ws.length;
    ws.forEach(([n, g, col], i) => {
      const T = Math.sqrt(2 * S.h / g), t = Math.min(S.t, T), d = .5 * g * t * t, x0 = 60 + colW * i + 40, xm = S.v0 * t, maxX = S.v0 * Math.sqrt(2 * S.h / Math.min(...ws.map(w => w[1]))) || 1;
      const xs = S.v0 ? (colW - 90) / Math.max(maxX, 1) : 0;
      ctx.fillStyle = col; ctx.globalAlpha = .35; for (let k = 0; k <= 20; k++) { const tk = T * k / 20; if (tk > t) break; ctx.beginPath(); ctx.arc(x0 + S.v0 * tk * xs, bot - (S.h - .5 * g * tk * tk) * sc - 12, 4, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
      for (let k = 1; k * .25 <= t; k++) { const tk = k * .25; ctx.fillStyle = p.muted; ctx.globalAlpha = .6; ctx.beginPath(); ctx.arc(x0 + S.v0 * tk * xs - 18, bot - (S.h - .5 * g * tk * tk) * sc - 12, 2, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }

    });
    if (S.cmp) { const e = Math.sqrt(2 * S.h / 9.8), t = Math.min(S.t, e); ro.set('t', fmt(S.t, 2) + ' s'); ro.set('v', fmt(9.8 * t, 2) + ' m/s (Toka)'); ro.set('a', '9,8 / 1,62 / 3,71'); ro.set('d', fmt(.5 * 9.8 * t * t, 1) + ' m (Toka)'); ro.set('T', ws.map(w => fmt(Math.sqrt(2 * S.h / w[1]), 2)).join(' / ') + ' s'); ro.set('vf', ws.map(w => fmt(Math.sqrt(2 * w[1] * S.h), 1)).join(' / ')); }
    const series = ws.map(([n, g, col]) => { const T = Math.sqrt(2 * S.h / g), d = []; for (let k = 0; k <= 60; k++) { const tk = Math.min(S.t, T) * k / 60; d.push([tk, g * tk]); } return { data: d, color: col, label: n }; });
    clear(ch.ctx, W, 200, false); chart(ch.ctx, 6, 6, W - 12, 188, series, { title: 'Grafiku shpejtësi–kohë (v–t)', xl: 't (s) →  v (m/s)', xmax: Tmax, ymax: Math.max(...ws.map(w => Math.sqrt(2 * w[1] * S.h))), legend: true });

/* ---------------- B. FËRKIMI ---------------- */
function simFerkim(el) {
  const { main, ctrl } = labLayout(el, '🧱 Laboratori i fërkimit', 'Shty një bllok mbi sipërfaqe të ndryshme. Krahaso fërkimin statik me atë kinetik: F<sub>f</sub> = μ·N.');

  const S = { s: 'dru', m: 10, F: 40, ms: .5, mk: .3, v: 0, x: 80, t: 0, hist: [], run: true };
  const ro = readout(ctrl, [['N', 'Forca normale N'], ['ff', 'Fërkimi F_f'], ['net', 'Forca rezultante'], ['a', 'Nxitimi a'], ['v', 'Shpejtësia v'], ['st', 'Gjendja']]);
  selectEl(ctrl, 'Sipërfaqja', Object.entries(SURF).map(([k, v]) => [k, `${v[0]} (μs ${fmt(v[1])}, μk ${fmt(v[2])})`]), 'dru', v => { S.s = v; mus.set(SURF[v][1]); muk.set(SURF[v][2]); });
  slider(ctrl, 'Masa e bllokut m', 1, 50, 1, S.m, 'kg', v => S.m = v);
  slider(ctrl, 'Forca e zbatuar F', 0, 300, 1, S.F, 'N', v => S.F = v);
  const mus = slider(ctrl, 'Koeficienti statik μs', 0, 1.2, .01, S.ms, '', v => { S.ms = v; if (S.mk > v) muk.set(v); });
  const muk = slider(ctrl, 'Koeficienti kinetik μk', 0, 1.2, .01, S.mk, '', v => { S.mk = Math.min(v, S.ms); });

  note(ctrl, '💡 Rrit forcën ngadalë: blloku nis vetëm kur F > μs·N. Pastaj fërkimi bie në μk·N — prandaj blloku “kërcen” përpara.');
  Loops.add(dt => {
    const N = S.m * G0, fsMax = S.ms * N, fk = S.mk * N; let ff, st;
    if (S.run) {
      if (S.v < 1e-4) { if (S.F <= fsMax) { ff = S.F; S.v = 0; st = 'Në qetësi (statik)'; } else { ff = fk; st = 'Rrëshqet (kinetik)'; S.v += (S.F - fk) / S.m * dt; } }
      else { ff = fk; st = 'Rrëshqet (kinetik)'; S.v += (S.F - fk) / S.m * dt; if (S.v < 0) S.v = 0; }
      S.x += S.v * dt * 40; if (S.x > W) S.x = -100; S.t += dt; S.hist.push([S.t, S.v]); if (S.hist.length > 600) S.hist.shift();
    } else { ff = S.v > 0 ? fk : Math.min(S.F, fsMax); st = 'Pauzë'; }
    const net = S.F - ff, a = S.v > 0 || S.F > fsMax ? net / S.m : 0;
    ro.set('N', fmt(N, 1) + ' N'); ro.set('ff', fmt(ff, 1) + ' N'); ro.set('net', fmt(Math.max(0, net), 1) + ' N'); ro.set('a', fmt(Math.max(0, a), 2) + ' m/s²'); ro.set('v', fmt(S.v, 2) + ' m/s'); ro.set('st', st);

    ctx.fillStyle = col; ctx.fillRect(0, gy, W, 70); ctx.globalAlpha = .25; ctx.fillStyle = '#000'; for (let i = 0; i < 80; i++) { const xx = ((i * 53 - S.x * 0) % W + W) % W; ctx.fillRect(xx, gy + (i * 17) % 60, S.s === 'rere' ? 3 : 14, 2); } ctx.globalAlpha = 1;

    const sc = 180 / Math.max(200, S.F, N); const cx = x + bw / 2, cy = y + bh / 2;

  }, c);

  selectEl(ctrl, 'Materiali i objektit', Object.entries(MATS).map(([k, v]) => [k, `${v[0]}${k !== 'c' ? ' — ' + v[1] + ' kg/m³' : ''}`]), 'dru', v => { S.mat = v; if (v === 'c') { cs.classList.remove('hidden'); S.rho = +cs.inp.value; } else { cs.classList.add('hidden'); S.rho = MATS[v][1]; } hold(); });

/* ---------------- F. PJERRËSIA, FORCA NORMALE, TENSIONI ---------------- */
function simPjerresi(el) {
  const { main, ctrl } = labLayout(el, '📐 Forca normale dhe tensioni', 'Trup në rrafsh të pjerrët, me litar dhe makarë. Të gjitha forcat dhe llogaritjet shfaqen në kohë reale.');
  const W = 760, H = 540; const c = mkCanvas(main, W, H);
  const S = { a: 30, m1: 5, m2: 3, mu: .2, F: 0, pul: true, s: 0, v: 0, run: true };
  const calc = h('<div class="calcsteps"></div>');
  slider(ctrl, 'Këndi α', 0, 70, 1, S.a, '°', v => { S.a = v; rs(); });
  slider(ctrl, 'Masa në rrafsh m₁', 1, 20, .5, S.m1, 'kg', v => { S.m1 = v; rs(); });
  const m2s = slider(ctrl, 'Masa e varur m₂', 0, 20, .5, S.m2, 'kg', v => { S.m2 = v; rs(); });
  slider(ctrl, 'Koeficienti i fërkimit μ', 0, 1, .01, S.mu, '', v => { S.mu = v; rs(); });
  slider(ctrl, 'Forca e zbatuar F (lart rrafshit)', 0, 150, 1, 0, 'N', v => { S.F = v; rs(); });
  btnRow(ctrl, [['🪢 Litar + makarë', b => { S.pul = !S.pul; b.classList.toggle('on', S.pul); m2s.classList.toggle('hidden', !S.pul); rs(); }, 'on'], ['↺ Rifillo', () => rs()], ['⏸/▶', () => S.run = !S.run]]);
  ctrl.appendChild(calc);
  function rs() { S.s = 0; S.v = 0; }
  Loops.add(dt => {
    const a = S.a * Math.PI / 180, m1 = S.m1, m2 = S.pul ? S.m2 : 0, N = m1 * G0 * Math.cos(a), Px = m1 * G0 * Math.sin(a), fmax = S.mu * N;
    const D = m2 * G0 + S.F - Px; const M = m1 + m2; let acc, Ff, state;
    if (Math.abs(S.v) < 1e-3 && Math.abs(D) <= fmax) { acc = 0; Ff = -D; S.v = 0; state = 'Ekuilibër (fërkimi statik e mban)'; }
    else { const dir = Math.abs(S.v) > 1e-3 ? Math.sign(S.v) : Math.sign(D); Ff = -dir * fmax; acc = (D + Ff) / M; state = dir > 0 ? 'Lëviz lart rrafshit ↗' : 'Rrëshqet poshtë ↙'; }
    const T = S.pul ? m2 * (G0 - acc) : 0;
    if (S.run) { const v0 = S.v; S.v += acc * dt; if (v0 !== 0 && Math.sign(S.v) !== Math.sign(v0) && Math.abs(D) <= fmax) S.v = 0; S.s += S.v * dt; if (S.s > 1.3 || S.s < -1.3) { S.s = 0; S.v = 0; } }
    calc.textContent = `P = m₁·g = ${fmt(m1 * G0, 1)} N\nN = m₁·g·cos α = ${fmt(N, 1)} N\nP∥ = m₁·g·sin α = ${fmt(Px, 1)} N\nF_f,max = μ·N = ${fmt(fmax, 1)} N\n${S.pul ? `P₂ = m₂·g = ${fmt(m2 * G0, 1)} N\n` : ''}F = ${fmt(S.F, 0)} N\n────────────\nF_f = ${fmt(Math.abs(Ff), 1)} N\na = ${fmt(acc, 2)} m/s²\n${S.pul ? `T = m₂(g − a) = ${fmt(T, 1)} N\n` : ''}Gjendja: ${state}`;
    const ctx = c.ctx, p = pal(); clear(ctx, W, H); const ox = 50, oy = H - 200, L = Math.min(520, (oy - 30) / Math.max(Math.sin(a), .01));
    const sinA = Math.sin(a), cosA = Math.cos(a); const ex = ox + cosA * L, ey = oy - sinA * L;
    ctx.fillStyle = p.ground; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, oy); ctx.lineTo(ex, ey); ctx.closePath(); ctx.fill(); ctx.strokeStyle = p.line; ctx.stroke(); ctx.fillStyle = p.line; ctx.fillRect(ox - 10, oy, ex - ox + 10, 10); ctx.fillRect(ox, oy + 10, 10, H - oy - 10); ctx.fillRect(ex - 10, oy + 10, 10, H - oy - 10);
    ctx.strokeStyle = CLR.N; ctx.beginPath(); ctx.arc(ox, oy, 46, -a, 0); ctx.stroke(); txt(ctx, `α = ${S.a}°`, ox + 52, oy - 14, CLR.N, 13);
    if (S.pul) { ctx.fillStyle = '#9aa8ff'; ctx.beginPath(); ctx.arc(ex + 4, ey - 14, 16, 0, 7); ctx.fill(); ctx.fillStyle = p.text; ctx.beginPath(); ctx.arc(ex + 4, ey - 14, 4, 0, 7); ctx.fill(); }
    const d = L * .5 + S.s * 90, bx = ox + cosA * d, by = oy - sinA * d; const bs = 34 + m1 * 1.5;
    ctx.save(); ctx.translate(bx, by); ctx.rotate(-a); box3d(ctx, -bs / 2, -bs, bs, bs, '#3d8bff'); txt(ctx, 'm₁', 0, -bs / 2, '#fff', 13, 'center'); ctx.restore();
    const cx = bx - sinA * bs / 2, cy = by - cosA * bs / 2; const k = 1.3;
    if (S.pul) { const rx = bx + cosA * bs / 2 - sinA * bs / 2, ry = by - sinA * bs / 2 - cosA * bs / 2; ctx.strokeStyle = '#d6b37a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(ex + 4 - sinA * 16, ey - 14 - cosA * 16); ctx.stroke(); const hy = ey + 50 + (S.s + 1.3) * 40; ctx.beginPath(); ctx.moveTo(ex + 20, ey - 14); ctx.lineTo(ex + 20, hy); ctx.stroke(); const hs = 26 + m2 * 1.2; box3d(ctx, ex + 20 - hs / 2, hy, hs, hs, '#ff4fd8'); txt(ctx, 'm₂', ex + 20, hy + hs / 2, '#fff', 13, 'center'); arrow(ctx, ex + 20, hy, ex + 20, hy - T * k * .8, CLR.T, 'T', 3); arrow(ctx, ex + 20, hy + hs, ex + 20, hy + hs + m2 * G0 * k * .8, CLR.W, 'P₂', 2); arrow(ctx, cx, cy, cx + cosA * T * k, cy - sinA * T * k, CLR.T, 'T', 3); }
    arrow(ctx, cx, cy, cx, cy + m1 * G0 * k, CLR.W, 'P', 3); arrow(ctx, cx, cy, cx - sinA * N * k, cy - cosA * N * k, CLR.N, 'N', 3);
    if (Math.abs(Ff) > .05) arrow(ctx, bx, by, bx + cosA * Ff * k, by - sinA * Ff * k, CLR.Ff, 'Ff', 3);
    if (S.F > 0) arrow(ctx, cx, cy - 8, cx + cosA * S.F * k, cy - 8 - sinA * S.F * k, CLR.F, 'F', 3);
    txt(ctx, state, 14, 20, p.text, 13, 'left', 700);
  }, c);
}

/* ---------------- H. FORCA CENTRIPETALE ---------------- */
function simCentripetale(el) {
  const { main, ctrl } = labLayout(el, '🎡 Laboratori i forcës centripetale', 'Ndrysho masën, shpejtësinë dhe rrezen. F<sub>c</sub> = m·v²/r, e drejtuar gjithmonë drejt qendrës.');
  const W = 760, H = 440; const c = mkCanvas(main, W, H);
  const S = { m: 1, v: 5, r: 2, a: 0, free: null };
  const ro = readout(ctrl, [['F', 'Forca centripetale F_c'], ['ac', 'Nxitimi centripetal'], ['w', 'Shpejtësia këndore ω'], ['T', 'Periudha T']]);
  slider(ctrl, 'Masa m', .1, 10, .1, S.m, 'kg', v => S.m = v);
  slider(ctrl, 'Shpejtësia v', .5, 15, .1, S.v, 'm/s', v => S.v = v);
  slider(ctrl, 'Rrezja r', .5, 4, .1, S.r, 'm', v => S.r = v);
  btnRow(ctrl, [['✂️ Këput fijen', () => { if (!S.free) { const sc = 45, x = Math.cos(S.a) * S.r * sc, y = Math.sin(S.a) * S.r * sc; S.free = { x, y, vx: -Math.sin(S.a) * S.v * sc, vy: Math.cos(S.a) * S.v * sc, t: 0 }; Sfx.play('bad'); } }, 'primary'], ['↺ Rilidh', () => S.free = null]]);
  note(ctrl, '💡 Kur fija këputet, forca centripetale zhduket dhe topi vazhdon në vijë të drejtë, <b>tangjent</b> me rrethin (ligji i parë i Njutonit). Dyfisho v → F katërfishohet!');
  Loops.add(dt => {
    const F = S.m * S.v * S.v / S.r, w = S.v / S.r; ro.set('F', fmt(F, 2) + ' N'); ro.set('ac', fmt(S.v * S.v / S.r, 2) + ' m/s²'); ro.set('w', fmt(w, 2) + ' rad/s'); ro.set('T', fmt(2 * Math.PI / w, 2) + ' s');
    const ctx = c.ctx, p = pal(); clear(ctx, W, H); const cx = 230, cy = H / 2, sc = 45;
    ctx.strokeStyle = p.line; ctx.setLineDash([5, 6]); ctx.beginPath(); ctx.arc(cx, cy, S.r * sc, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = p.text; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 7); ctx.fill();
    const rb = 8 + Math.sqrt(S.m) * 5;
    if (!S.free) {
      S.a += w * dt * .6; const x = cx + Math.cos(S.a) * S.r * sc, y = cy + Math.sin(S.a) * S.r * sc;
      ctx.strokeStyle = '#d6b37a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
      for (let i = 1; i < 14; i++) { const aa = S.a - i * .06 * Math.min(2, w); ctx.fillStyle = `rgba(180,92,255,${.35 - i * .025})`; ctx.beginPath(); ctx.arc(cx + Math.cos(aa) * S.r * sc, cy + Math.sin(aa) * S.r * sc, rb * (1 - i / 16), 0, 7); ctx.fill(); }
      ball(ctx, x, y, rb, '#b45cff'); const L = clamp(Math.log10(1 + F) * 40, 15, S.r * sc - 10); arrow(ctx, x, y, x - Math.cos(S.a) * L, y - Math.sin(S.a) * L, CLR.C, 'Fc', 4); arrow(ctx, x, y, x - Math.sin(S.a) * (20 + S.v * 5), y + Math.cos(S.a) * (20 + S.v * 5), CLR.F, 'v', 2);
    } else {
      S.free.t += dt; S.free.x += S.free.vx * dt * .6; S.free.y += S.free.vy * dt * .6; const x = cx + S.free.x, y = cy + S.free.y;
      ctx.setLineDash([3, 5]); ctx.strokeStyle = CLR.F; ctx.beginPath(); ctx.moveTo(cx + S.free.x - S.free.vx * S.free.t * .6, cy + S.free.y - S.free.vy * S.free.t * .6); ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]); ball(ctx, x, y, rb, '#b45cff');
      txt(ctx, 'Pa forcë centripetale → lëvizje drejtvizore (tangjente)', 14, 22, '#ff8a3d', 13, 'left', 700); if (Math.abs(x) > 2000 || Math.abs(y) > 2000) S.free = null;
    }
    const gx = 470, gy = 40, gw = 270, gh = 360, vmax = 15, fm = S.m * vmax * vmax / S.r;
    const d = []; for (let v = 0; v <= vmax; v += .5) d.push([v, S.m * v * v / S.r]); chart(ctx, gx, gy, gw, gh, [{ data: d, color: '#b45cff' }], { title: 'F_c në varësi të v', xl: 'v (m/s) → F (N)', xmax: vmax, ymax: fm });
    const L = gx + 42, R = gx + gw - 12, T = gy + 24, B = gy + gh - 26; ctx.fillStyle = '#ffd23d'; ctx.shadowColor = '#ffd23d'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(L + S.v / vmax * (R - L), B - F / fm * (B - T), 7, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  }, c);
}

function confetti(n = 60) {
  const box = h('<div style="position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden"></div>'); document.body.appendChild(box);
  for (let i = 0; i < n; i++) { const p = document.createElement('i'); const c = ['#3ddcff', '#7c5cff', '#ff4fd8', '#ffd23d', '#2ee59d'][i % 5]; p.style.cssText = `position:absolute;left:${50 + (Math.random() - .5) * 30}%;top:40%;width:8px;height:12px;background:${c};border-radius:2px;transition:transform 1.4s cubic-bezier(.1,.7,.3,1),opacity 1.4s;`; box.appendChild(p); requestAnimationFrame(() => { p.style.transform = `translate(${(Math.random() - .5) * 900}px,${Math.random() * 600 - 200}px) rotate(${Math.random() * 720}deg)`; p.style.opacity = 0; }); }
  setTimeout(() => box.remove(), 1600);
}
function gameShell(el, g) {
  el.innerHTML = `<div class="wrap" style="padding-top:30px"><a href="#/lojera" class="btn sm">← Të gjitha lojërat</a><div class="sec-head" style="margin:24px auto 24px"><span class="kicker">Loja ${GAMES.indexOf(g) + 1} / 8</span><h2>${g.i} ${g.t}</h2><p>${g.d}</p></div><div class="glass card qbox" id="gbox"></div></div>`;
  return $('#gbox', el);
}
function hud(score, level, idx, tot, extra = '') { return `<div class="hud"><span class="pill">⭐ Pikët: <b>${score}</b></span><span class="pill">📶 Niveli ${level}</span><span class="pill">${idx}/${tot}</span>${extra}</div><div class="qbar"><i style="width:${(idx - 1) / tot * 100}%"></i></div>`; }
function endScreen(box, id, score, max, msg, replay) {
  recordGame(id, score); const best = Store.get('best')[id] || score; const pct = max ? Math.round(score / max * 100) : 0;
  if (pct >= 70) { confetti(); Sfx.play('win'); }
  box.innerHTML = `<div style="text-align:center"><div style="font-size:4rem">${pct >= 90 ? '🏆' : pct >= 60 ? '🥈' : '📚'}</div><h2 style="margin:8px 0">Pikët: <span class="grad-text">${score}</span>${max ? ` / ${max}` : ''}</h2><p class="muted">${msg || ''}</p><p style="margin:10px 0">🥇 Rekordi yt: <b>${best}</b></p><div class="btnrow" style="justify-content:center;margin-top:16px"><button class="btn primary" id="again">↻ Luaj përsëri</button><a class="btn" href="#/lojera">🎮 Lojë tjetër</a><a class="btn" href="#/progresi">🏅 Tabela e rezultateve</a></div></div>`;
  $('#again', box).onclick = replay;
}
function mcq(box, q, opts, correct, onAns, explain) {
  const order = shuffle(opts.map((t, k) => ({ t, k })));
  const wrap = h(`<div class="qopts">${order.map((o, n) => `<button class="qopt" data-k="${o.k}"><span class="l">${'ABCD'[n]}</span>${o.t}</button>`).join('')}</div>`); box.appendChild(wrap);
  $$('.qopt', wrap).forEach(b => b.onclick = () => {
    const ok = +b.dataset.k === correct; $$('.qopt', wrap).forEach(x => { x.disabled = true; if (+x.dataset.k === correct) x.classList.add('ok'); }); if (!ok) b.classList.add('bad');

  const box = gameShell(el, g); let qs, i, score, lvl, run;

/* 4. SFIDA E GRAVITETIT */
function gameGravitet(el, g) {
  const box = gameShell(el, g); let i, score, R;
  const start = () => { i = 0; score = 0; R = Array.from({ length: 5 }, () => { const pl = PLANETS[[0, 1, 3, 5][Math.random() * 4 | 0]]; return { pl, h: 10 + Math.round(Math.random() * 70), v: 2 + Math.round(Math.random() * 10) }; }); next(); };
  const next = () => {
    if (i >= R.length) return endScreen(box, g.id, score, 500, 'Distanca horizontale: x = v · √(2h / g)', start);
    Loops.stopAll(); const r = R[i], g0 = r.pl[1], T = Math.sqrt(2 * r.h / g0), X = r.v * T; const xmax = Math.max(X * 1.8, 20);
    box.innerHTML = hud(score, 1, i + 1, R.length) + `<h3>${r.pl[2]} Në ${r.pl[3]} (g = ${fmt(g0, 2)} m/s²)</h3><p class="muted">Topi hidhet horizontalisht me <b>v = ${r.v} m/s</b> nga një shkëmb <b>${r.h} m</b> i lartë. <b>Kliko në tokë</b> ku mendon se do të bjerë!</p>`;
    const W = 720, H = 320; const c = mkCanvas(box, W, H); const info = h('<div></div>'); box.appendChild(info);
    const L = 80, Rr = W - 30, gy = H - 40, top = 50, sx = (Rr - L) / xmax, sy = (gy - top) / r.h; let guess = null, t0 = null;
    Loops.add((dt, t) => {
      const ctx = c.ctx, p = pal(); clear(ctx, W, H); ctx.fillStyle = p.ground; ctx.fillRect(0, gy, W, 40); ctx.fillRect(0, top, L, gy - top);
      for (let m = 0; m <= xmax; m += Math.max(2, Math.round(xmax / 10))) { txt(ctx, m + ' m', L + m * sx, gy + 16, p.muted, 10, 'center'); ctx.fillStyle = p.muted; ctx.fillRect(L + m * sx, gy, 1, 6); }
      txt(ctx, r.h + ' m', 10, top + (gy - top) / 2, p.text, 12);
      let bx = L, by = top - 10;
      if (t0 !== null) { const tt = Math.min(T, (t - t0) * Math.max(1, T / 2.2)); bx = L + r.v * tt * sx; by = top - 10 + .5 * g0 * tt * tt * sy; ctx.strokeStyle = '#ff4fd8'; ctx.setLineDash([4, 4]); ctx.beginPath(); for (let k = 0; k <= 40; k++) { const tk = tt * k / 40; const x = L + r.v * tk * sx, y = top - 10 + .5 * g0 * tk * tk * sy; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.setLineDash([]); if (tt >= T && !info.done) finish(); }
      ball(ctx, bx, Math.min(by, gy - 10), 10, '#ff4fd8');
      if (guess !== null) { emoji(ctx, '🚩', L + guess * sx, gy - 16, 28); }
      if (info.done) { emoji(ctx, '💥', L + X * sx, gy - 6, 26); }
    }, c);
    c.addEventListener('click', e => { if (guess !== null) return; const p = ptr(c, e); if (p.x < L) return; guess = (p.x - L) / sx; t0 = performance.now() / 1000; Sfx.play('click'); });
    function finish() { info.done = true; const err = Math.abs(guess - X) / X; const pts = Math.max(0, Math.round(100 - err * 200)); score += pts; Sfx.play(pts >= 60 ? 'ok' : 'bad'); streak(pts >= 60); if (pts >= 80) confetti(20);
      info.innerHTML = `<div class="explain"><b>${pts >= 80 ? '🎯 Shumë afër!' : pts >= 40 ? '👍 Jo keq!' : '😅 Larg!'} +${pts} pikë</b><br>T = √(2h/g) = √(2·${r.h}/${fmt(g0, 2)}) = ${fmt(T, 2)} s → x = v·T = ${r.v}·${fmt(T, 2)} = <b>${fmt(X, 1)} m</b>. Ti zgjodhe ${fmt(guess, 1)} m.</div>`; i++; nextBtn(info, i < R.length ? 'Raundi tjetër →' : 'Rezultati', next); }
  }; start();
}

      $$('.qopt', box).forEach(b => b.onclick = () => answer(+b.dataset.k));

    }; show();

  const total = Math.round((v.length / FORCES.length * .35 + labs.length / LABS.length * .25 + Object.keys(Store.get('games')).length / GAMES.length * .2 + Store.get('ach').length / ACHIEVEMENTS.length * .2) * 100);
  const w = wrapPage(el, `<section class="block" style="padding-top:40px">${sectionHead('Paneli personal', 'Progresi <span class="grad-text">yt</span>', 'Gjithçka ruhet në këtë shfletues (localStorage).')}
   <div class="glass card" style="margin-bottom:22px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;align-items:center"><h3>🚀 Progresi i përgjithshëm: <span class="grad-text">${total}%</span></h3><div style="display:flex;gap:8px;align-items:center"><input type="text" id="nm" placeholder="Emri yt për tabelën" value="${esc(Store.get('name'))}" maxlength="24" style="width:220px"><button class="btn sm" id="sv">Ruaj</button></div></div><div class="qbar" style="height:14px"><i style="width:${total}%"></i></div>
   <div class="stats" style="margin-top:16px">${[[v.length + '/' + FORCES.length, 'Forca të vizituara'], [labs.length + '/' + LABS.length, 'Simulime të provuara'], [Object.keys(Store.get('games')).length + '/' + GAMES.length, 'Lojëra të luajtura'], [hist.length, 'Teste të kryera']].map(([n, l]) => `<div class="glass stat"><b>${n}</b><span>${l}</span></div>`).join('')}</div></div>
   <div class="grid g2"><div class="glass card"><h3>⭐ Të preferuarat</h3><div class="chips" style="margin-top:12px">${favs.length ? favs.map(id => { const f = forceById(id); return f ? `<a class="pill" href="#/forca/${id}">${f.ikona} ${f.emri}</a>` : ''; }).join('') : '<p class="muted">Shto forca me ⭐ nga paneli i forcave.</p>'}</div>
    <h3 style="margin-top:22px">🧭 Forcat e eksploruara</h3><div class="chips" style="margin-top:12px">${FORCES.map(f => `<a class="pill" href="#/forca/${f.id}" style="${v.includes(f.id) ? 'border-color:#2ee59d;color:var(--text)' : 'opacity:.5'}">${v.includes(f.id) ? '✔' : '○'} ${f.emri}</a>`).join('')}</div></div>
   <div class="glass card"><h3>🏅 Arritjet (${Store.get('ach').length}/${ACHIEVEMENTS.length})</h3><div class="grid g2" style="margin-top:14px">${achHTML()}</div></div></div>
   <div class="grid g2" style="margin-top:22px"><div class="glass card"><h3>🏆 Tabela e rezultateve</h3>${lbHTML()}</div><div class="glass card"><h3>📜 Historiku i testeve</h3>${hist.length ? `<table class="lb" style="margin-top:12px"><tr><th>Data</th><th>Tema</th><th>Rezultati</th></tr>${hist.slice(-10).reverse().map(x => `<tr><td>${x.d}</td><td>${x.t}</td><td><b>${x.p}%</b></td></tr>`).join('')}</table>` : '<p class="muted" style="margin-top:12px">Ende pa teste. <a href="#/kuize">Bëj testin e parë →</a></p>'}</div></div>
   <div style="text-align:center;margin-top:30px"><button class="btn" id="rst">🗑️ Fshi të gjithë progresin</button></div></section>`);
  $('#sv', w).onclick = () => { Store.set('name', $('#nm', w).value.trim().slice(0, 24)); toast('Emri u ruajt', '✅'); };
  $('#rst', w).onclick = (e) => { const b = e.currentTarget; if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = '⚠️ Kliko përsëri për të konfirmuar fshirjen'; setTimeout(() => { if (b.isConnected) { delete b.dataset.ok; b.textContent = '🗑️ Fshi të gjithë progresin'; } }, 4000); return; } { const th = Store.get('theme'); Store.s = { ...Store.d, visited: [], favs: [], labs: [], games: {}, best: {}, ach: [], hist: [], lb: [], theme: th }; Store.save(); route(); toast('Progresi u fshi', '🗑️'); } };
};

PAGES.notfound = (el) => { wrapPage(el, `<section class="block" style="text-align:center;padding-top:100px"><div style="font-size:5rem">🕳️</div><h2>Kjo faqe u zhduk në një vrimë të zezë!</h2><p class="muted" style="margin:14px 0 24px">Faqja që kërkon nuk ekziston.</p><a href="#/" class="btn primary">🏠 Kthehu në kryefaqe</a></section>`); };

initShell();

</script>
</body>
</html>
